name: ChangeSignal

# PR events: post the impact card (uses the Claude API key), request owners, set the gate.
#
# Security: `pull_request_target` runs this workflow file and ChangeSignal's own code from the
# BASE branch, never from the PR. The PR head is checked out into `pr-head/` only so that
# caller detection can parse it with `ast` (parsing does not run the code). The API key is an
# environment secret of `LLM_API_KEY`, an environment that only the default branch may use, so a workflow
# added or edited inside a PR cannot read it. Review events are handled by
# changesignal-review.yml, which gets no key.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: write
  statuses: write

# Same group in both ChangeSignal workflows: runs for one PR never overlap, so an older
# run cannot overwrite a newer owner-ack verdict. Cost: if a PR-event run is still queued
# when a review arrives, GitHub replaces it with the review run; the status is still
# recomputed correctly, but the card waits for the next push or description edit.
concurrency:
  group: changesignal-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  reconcile:
    # Fork PRs are not supported (their authors are not collaborators we can request).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: LLM_API_KEY
    steps:
      # Fail closed: clear any earlier green on this commit before anything can fail.
      - name: Mark owner-ack pending
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: >
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA"
          -f state=pending -f context=changesignal/owner-ack
          -f description="ChangeSignal is checking this commit..."
      - name: Check out ChangeSignal (base branch, trusted)
        uses: actions/checkout@v4
      - name: Check out the PR head (parsed only, never run)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m changesignal.main
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.LLM_API_KEY }}
          CHANGESIGNAL_REPO_ROOT: pr-head
          # Card language: set the repository variable CHANGESIGNAL_LANG to "zh-TW" for Chinese.
          CHANGESIGNAL_LANG: ${{ vars.CHANGESIGNAL_LANG || 'en' }}
