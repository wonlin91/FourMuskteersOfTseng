name: ChangeSignal

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: write
  statuses: write

# One run at a time per PR, so a push and a review cannot race to create the card.
concurrency:
  group: changesignal-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  reconcile:
    # Fork PRs get a read-only token and no secrets; we only support same-repo branches.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Fail closed: clear any earlier green on this commit before anything can fail
      # (e.g. pip install failing on the run for a dismissed approval).
      - name: Mark owner-ack pending
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: >
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA"
          -f state=pending -f context=changesignal/owner-ack
          -f description="ChangeSignal is checking this commit..."
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m changesignal.main
        env:
          GH_TOKEN: ${{ github.token }}
          # Either secret name works. Without a key the card is posted without the AI summary.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.LLM_API_KEY }}
          # Card language: set the repository variable CHANGESIGNAL_LANG to "zh-TW" for Chinese.
          CHANGESIGNAL_LANG: ${{ vars.CHANGESIGNAL_LANG || 'en' }}
