name: ChangeSignal

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: write
  statuses: write

# One run at a time per PR, so a push and a review cannot race to create the card.
concurrency:
  group: changesignal-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  reconcile:
    # Fork PRs get a read-only token and no secrets; we only support same-repo branches.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m changesignal.main
        env:
          GH_TOKEN: ${{ github.token }}
